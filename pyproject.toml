[project]
name = "voice-agent"
version = "0.1.0"
description = "Realtime voice agent: a Google Meet assistant on Qwen Omni and a LiveKit voice pipeline with live agent-to-agent handoff."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "jsonschema==4.26.0",
    "livekit==1.1.15",
    "livekit-api==1.2.1",
    "livekit-agents[langchain,silero]==1.7.1",
    "numpy",
    "PyJWT",
    "python-dotenv",
    "redis",
    "scipy",
    "langchain>=1.3.18",
    "langchain-core>=1.6.1",
    "langgraph>=1.2.11",
    "langchain-openai>=1.6.0",
    "aiohttp>=3.14.3",
    "playwright>=1.63.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.5",
]

[tool.ruff]
required-version = "==0.16.5"
line-length = 320

[tool.ruff.lint]
select = ["ASYNC", "F401", "F841", "RUF100", "RUF012", "PLE"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
timeout = 300
timeout_method = "thread"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs live infrastructure (redis, a LiveKit server, Chrome). The unit tier runs -m 'not integration'.",
    "provider: makes an explicitly enabled, cost-bounded call to an external provider.",
]

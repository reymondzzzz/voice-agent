[project]
name = "voice-agent"
version = "0.1.0"
description = "Standalone voice agent: live agent-to-agent handoff with voice switching, and multi-agent rooms."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.18",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "livekit-agents[langchain,silero]~=1.5",
    "python-dotenv>=1.2.3",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.5",
]

[tool.ruff]
required-version = "==0.16.5"
line-length = 320

[tool.ruff.lint]
select = ["ASYNC", "F401", "F841", "RUF100", "RUF012", "PLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
timeout = 300
timeout_method = "thread"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "provider: makes an explicitly enabled, cost-bounded call to an external speech or LLM provider.",
    "room: needs a reachable self-hosted LiveKit server.",
]

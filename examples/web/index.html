<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voice-agent</title>
<style>
  :root {
    --bg: #0a0b0f;
    --surface: #14161d;
    --surface-2: #1b1e27;
    --line: #272b36;
    --text: #e7e9ee;
    --muted: #8a90a0;
    --boss: #f0a742;
    --alice: #46c8d8;
    --bob: #9b7bf0;
    --danger: #e2596b;
    --agent: var(--boss);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 600; letter-spacing: -0.01em; }
  .brand span { color: var(--muted); font-weight: 400; }
  .pill {
    font-size: 12px; font-variant-numeric: tabular-nums;
    padding: 4px 10px; border-radius: 999px;
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
  }
  .pill[data-state="live"] { color: #7ee0a8; border-color: #2c5c42; }
  .pill[data-state="connecting"] { color: var(--boss); border-color: #5c4a2c; }
  .pill[data-state="error"] { color: var(--danger); border-color: #5c2c34; }

  main {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1fr 340px; gap: 1px;
    background: var(--line);
  }
  .stage, .panel { background: var(--bg); min-width: 0; }
  .stage {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 32px 20px;
  }
  #orb { width: 260px; height: 260px; display: block; }
  .active { text-align: center; }
  .active-name {
    font-size: 30px; font-weight: 600; letter-spacing: -0.02em;
    color: var(--agent); transition: color 240ms ease;
  }
  .active-role { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .panel { display: flex; flex-direction: column; min-height: 0; }
  .roster { list-style: none; margin: 0; padding: 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .roster li {
    display: flex; align-items: baseline; gap: 8px;
    padding: 9px 11px; border-radius: 8px;
    background: var(--surface); border: 1px solid transparent;
    opacity: 0.55; transition: opacity 200ms ease, border-color 200ms ease;
  }
  .roster li[data-active="true"] { opacity: 1; border-color: color-mix(in oklab, var(--dot) 55%, transparent); }
  .roster .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot); flex: none; align-self: center; }
  .roster .who { font-weight: 550; }
  .roster .what { color: var(--muted); font-size: 12px; margin-left: auto; }
  .roster li[data-agent="boss"] { --dot: var(--boss); }
  .roster li[data-agent="alice"] { --dot: var(--alice); }
  .roster li[data-agent="bob"] { --dot: var(--bob); }

  .transcript { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .transcript:empty::before {
    content: "Transcript appears here once the call is live.";
    color: var(--muted); font-size: 13px;
  }
  .line { font-size: 13.5px; }
  .line .from { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; display: block; }
  .line[data-from="you"] .from { color: #7ee0a8; }

  footer { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); }
  button {
    font: inherit; font-weight: 550; color: var(--text);
    padding: 10px 18px; border-radius: 9px; cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--line);
  }
  button:hover:not(:disabled) { background: #232733; }
  button:focus-visible { outline: 2px solid var(--alice); outline-offset: 2px; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #connect[data-live="true"] { background: color-mix(in oklab, var(--danger) 22%, var(--surface-2)); border-color: #5c2c34; }

  #banner {
    margin: 0 20px 14px; padding: 10px 12px; border-radius: 9px; font-size: 13px;
    background: color-mix(in oklab, var(--danger) 14%, var(--surface));
    border: 1px solid #5c2c34; color: #f4c3ca;
  }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    #orb { width: 180px; height: 180px; }
    .active-name { font-size: 24px; }
    .stage { padding: 24px 16px; gap: 20px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">voice-agent <span>&mdash; boss, alice, bob</span></div>
  <div id="status" class="pill" role="status" aria-live="polite" data-state="idle">idle</div>
</header>

<div id="banner" role="alert" aria-live="assertive" hidden></div>

<main>
  <section class="stage">
    <canvas id="orb" width="520" height="520" aria-hidden="true"></canvas>
    <div class="active">
      <div class="active-name" id="activeName" aria-live="polite">Boss</div>
      <div class="active-role" id="activeRole">answers first and routes the call</div>
    </div>
  </section>

  <aside class="panel">
    <ul class="roster" id="roster" aria-label="Agents on the call">
      <li data-agent="boss" data-active="true"><i class="dot"></i><span class="who">Boss</span><span class="what">routes</span></li>
      <li data-agent="alice" data-active="false"><i class="dot"></i><span class="who">Alice</span><span class="what">weather</span></li>
      <li data-agent="bob" data-active="false"><i class="dot"></i><span class="who">Bob</span><span class="what">time</span></li>
    </ul>
    <div class="transcript" id="transcript" role="log" aria-live="polite" aria-label="Call transcript"></div>
  </aside>
</main>

<footer>
  <button id="connect">Connect</button>
  <button id="mute" disabled>Mute</button>
</footer>

<script type="module" src="/static/app.js?v=2"></script>
</body>
</html>
